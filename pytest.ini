[pytest]
# Put the repository root on sys.path so `import src...` resolves.
#
# Without this, `pytest` and `python -m pytest` behave differently: the `-m`
# form prepends the working directory to sys.path, a bare `pytest` does not.
# Every local run in this project used `python -m pytest`, so the difference
# stayed invisible until CI ran `pytest` and failed at conftest import with
# `ModuleNotFoundError: No module named 'src'` — on the first CI run the
# repository ever had.
#
# Setting it here rather than editing the workflow means both invocations work,
# for CI and for anyone who clones this and types `pytest`.
pythonpath = .

testpaths = tests
