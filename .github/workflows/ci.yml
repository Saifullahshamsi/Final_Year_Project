name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The corpus is ~1.2 GB and is not in the repository, so CI never touches it.
# Every test builds its own synthetic corpus in code (see tests/conftest.py),
# reproducing the real twint schema and the known data quirks.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q --maxfail=1

      - name: Confirm no corpus or tweet text is committed
        run: |
          echo "Checking no raw dataset files are tracked..."
          if git ls-files | grep -E '^dataset/'; then
            echo "::error::raw dataset files are tracked"; exit 1
          fi
          echo "Checking no tracked CSV carries a 'tweet' column..."
          for f in $(git ls-files '*.csv'); do
            if head -1 "$f" | grep -qE '(^|,)"?tweet"?(,|$)'; then
              echo "::error::$f contains a tweet-text column"; exit 1
            fi
          done
          echo "Checking tracked file sizes..."
          for f in $(git ls-files); do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "::error::$f is $sz bytes (>5 MB)"; exit 1
            fi
          done
          echo "OK"
