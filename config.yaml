# Predictive Modelling of Social Media Trend Emergence — single source of truth.
# NO magic numbers in code. Every tunable lives here.
# Values marked [VERIFIED] were measured from the corpus, not assumed.

paths:
  trending_csv:     dataset/tweets_25_tendencia_raw.csv
  nontrending_csv:  dataset/tweets_25_notendencias_raw.csv
  outputs:          outputs
  cache:            outputs/cache
  tables:           outputs/tables
  figures:          outputs/figures

seed: 42

io:
  chunksize: 300000
  on_bad_lines: skip

# ---------------------------------------------------------------------------
# Collection band. [VERIFIED] The two pools were collected over different
# hours; 16:00-23:59 on 2020-02-25 is the only band BOTH genuinely cover.
# Binning outside it makes cross-class peak comparison invalid.
# 16:00 is treated as collection start for BOTH classes. Keep symmetric.
# ---------------------------------------------------------------------------
band:
  date:        "2020-02-25"
  start_hour:  16
  end_hour:    23          # inclusive; band ends 23:59:59
  drop_dates:  ["2020-02-26"]   # next-day residue, 151 rows

# Trending-only history, held out of the band. Used ONLY to validate the
# censoring filter after the fact. Never an input to the filter, never
# applied to negatives.
validation_history:
  enabled:    true
  start_hour: 1
  end_hour:   15

# ---------------------------------------------------------------------------
# Topic units
# ---------------------------------------------------------------------------
units:
  bin_minutes: 5           # 480-min band -> 96 bins
  smooth_bins: 3           # centred moving average before argmax; 1 = off

  # [VERIFIED] Negatives are the bottleneck throughout. At min 100 the total
  # caps at 112 units for a 60-min lead, below the 120 floor; 50 is what makes
  # the 1-hour lead viable at all.
  min_topic_tweets: 50
  min_topic_tweets_sweep: [50, 100, 150]   # reported as sensitivity analysis

  # Feature window: [peak - lead - length, peak - lead). Features NEVER see
  # data at or after (peak - lead).
  # Contingency level 2: the window was WIDENED (60 -> 90) rather than the lead
  # shortened, because lead time is the contribution being tested. A 30-min
  # lead reaches 149 units but surrenders the claim.
  window_minutes: 90
  lead_minutes: 60
  lead_sweep: [30, 60, 120, 180]           # lead-time curve (H2)
  window_sweep: [30, 60, 90]

  # TUNED PARAMETER. Set from unit counts alone, before any classifier existed;
  # no model performance was visible at selection time. 20 -> 15 is what clears
  # the 120-unit floor (102 -> 129). Sensitivity across 15/20/25 is reported at
  # evaluation. See outputs/tables/parameter_decision.md.
  min_window_tweets: 15

censoring:
  # LEFT: topic already running hot when collection starts -> its rise was
  # never recorded. Activity in the first band bin >= this fraction of peak.
  left_censor_frac: 0.25

  # RIGHT: peak too close to band end to be confirmed as a peak.
  min_post_peak_bins: 12          # 60 min of post-peak observation required
  post_peak_decay_frac: 0.70      # post-peak mean must fall below this x peak

language:
  # [VERIFIED] Topic-level language matching — the control gotcha #5 prescribes
  # — is IMPOSSIBLE on this corpus: zero English negatives in all 24 settings
  # swept. Substituted control is tweet-level filtering: units are defined on
  # all activity (the peak is a real-world event), but window FEATURES are
  # computed only from tweets in feature_language. Every unit's features are
  # then language-homogeneous, so language cannot carry class signal.
  feature_language: es            # null = use all languages
  es_majority_threshold: 0.5      # route-1 robustness check: es share of window
  negative_control_langs: null    # null = all; else e.g. ["es"]

# ---------------------------------------------------------------------------
# Feature-set assignment for the ablation.
#
# RULE: any feature whose value scales with the number of tweets or nodes in
# the window is VOLUME, not structure. Where the assignment is arguable it goes
# to volume — the conservative direction is the one that makes H1 harder to
# pass, so a positive result cannot be an artifact of shelving a node count in
# the structure arm.
#
# This matters because on these fragmented graphs n_components (149.6 vs 31.0)
# and n_communities (151.6 vs 31.3) track n_nodes (250.3 vs 51.2) almost
# exactly. They are node counts wearing structural names and are assigned to
# volume accordingly. Features that are mechanically ~1/N (density,
# max_pagerank, largest_wcc_frac, largest_community_frac) are inverse-size for
# the same reason and are also volume.
#
# Every feature column must appear in exactly one list; src/features/
# feature_sets.py fails loudly otherwise.
# ---------------------------------------------------------------------------
features:
  # The minimal volume baseline H1 must beat.
  volume_baseline:
    - window_tweets
    - unique_users
    - tweets_per_active_bin

  # Structural in name, size-driven in fact. Reported, and available as an
  # extended-volume arm, but never counted as structure.
  size_dependent:
    - active_bin_frac
    - n_nodes
    - n_edges
    - n_components
    - n_communities
    - community_entropy
    - mean_component_size
    - density
    - largest_wcc_frac
    - largest_community_frac
    - max_pagerank
    - max_in_degree
    - mean_in_degree
    - max_out_degree
    - max_core
    - mean_core
    - max_betweenness
    - mean_betweenness
    # Moved here by MEASUREMENT, not by reasoning about their formulas. All four
    # are bounded ratios and were assigned to structure on that basis, but on
    # sparse graphs their value is dominated by whether the window had enough
    # tweets to form a triangle or a mutual edge at all (reciprocity is zero on
    # 85% of units, mean_clustering on 80%). So they measure "big enough to have
    # structure", which is volume.
    # This costs the structure arm the prototype's two strongest network
    # features. The prototype built every graph from a fixed 150 tweets, which
    # controlled volume by construction; a variable-length pre-peak window does
    # not, and this is the price.
    - mean_clustering       # rho +0.556
    - core2_frac            # rho +0.505
    - modularity            # rho +0.447
    - reciprocity           # rho +0.447

  # XLM-T aggregates. All are means, fractions or moments — nothing scales with
  # tweet count. The scored-tweet count is emitted as meta_sent_n and excluded:
  # it is numerically identical to window_tweets (AUC 0.832), so modelling it
  # here would credit volume to sentiment.
  sentiment:
    - sent_mean
    - sent_var
    - sent_intensity
    - sent_strong_frac
    - sent_pos_frac
    - sent_neg_frac
    - sent_neu_frac
    - sent_skew
    - sent_polarisation

  # Curve-shape and ARIMA features that survived the size-proxy audit
  # (|Spearman| with window_tweets < 0.4). See audit: below.
  temporal:
    - slope_norm
    - accel_norm
    - peakedness
    - mass_centroid
    - frac_last_quarter
    - log_half_ratio
    # Second MA coefficient under the selected (0,1,2) order. rho +/-0.112 with
    # window_tweets, comfortably inside the threshold, and it replaces the
    # arima_ar1 that the old (1,1,1) order produced. The order change did not
    # alter how many features the channel contributes: 9 before, 9 now.
    - arima_ma2             # rho -0.112, AUC 0.626 — clean
    - arima_resid_acf1
    - arima_forecast_ratio

  # Temporal features that FAILED the audit. Dividing a count series by its own
  # mean does NOT make it scale-free: for counts, dispersion goes as 1/sqrt(mean)
  # (Poisson), and sparse windows have more empty bins, so every
  # dispersion/entropy/zero-share measure tracks volume mechanically.
  # zero_bin_frac is the extreme case at rho = -0.858.
  temporal_size_dependent:
    - burstiness            # rho -0.557 — CV of counts ~ 1/sqrt(mean)
    - bin_entropy           # rho +0.686 — bounded by number of non-empty bins
    - bin_gini              # rho -0.593 — same mechanism, inverted
    - monotone_up_frac      # rho +0.509 — ties at zero suppress increases
    - zero_bin_frac         # rho -0.858 — a discretisation artifact of low counts
    - arima_resid_cv        # rho -0.568 — Poisson dispersion again
    - acf1                  # rho +0.470 — highest temporal AUC (0.855); arguable, so volume
    # First MA coefficient under the selected (0,1,2) order. It fails the audit
    # harder than the old order's arima_ma1 did (rho +0.433 -> +0.557) and is
    # the second strongest univariate discriminator in the channel at AUC 0.810
    # — which is the point: a feature that predicts well *because* it tracks
    # volume belongs in volume, where it cannot be credited to the temporal arm.
    - arima_ma1             # rho +0.557, AUC 0.810 — size proxy

  # Scale-invariant: ratios, bounded fractions, normalised inequality measures
  # and growth slopes normalised by their own final value. Zero raw counts.
  # Survivors of the measured cross-channel audit (src/eval/size_audit.py).
  # core3_frac sits at rho +0.390, just inside the 0.4 threshold — marginal, and
  # kept only because the threshold was fixed before these numbers were seen.
  # Moving it after the fact would be changing the rule to suit the result.
  structure_size_free:
    - tweets_per_user
    - edges_per_tweet
    - edge_node_ratio_final
    - pagerank_gini
    - betweenness_gini
    - core3_frac            # rho +0.390 — marginal
    - node_growth_slope
    - edge_growth_slope
    - author_growth_slope
    - new_author_frac_last_slice

# Ablation hierarchy. Each arm names feature-set keys from `features` above.
# volume_plus_structure vs volume_only is the H1 test.
ablation:
  - name: chance
    sets: []
  - name: volume_only
    sets: [volume_baseline]
  - name: structure_size_free
    sets: [structure_size_free]
  - name: volume_plus_structure
    sets: [volume_baseline, structure_size_free]
  - name: sentiment_only
    sets: [sentiment]
  - name: volume_plus_sentiment
    sets: [volume_baseline, sentiment]
  # ADDITIONAL arm, never a replacement for structure_size_free. Regresses each
  # structure feature on the volume proxy and keeps the residual, recovering
  # signal from features that exile discards. It is the LESS CONSERVATIVE arm
  # and must not be read as the headline: report both, and if they disagree the
  # gap is the finding rather than something to resolve by preference.
  # The regression is fitted inside each CV fold on training data only.
  - name: structure_residualised
    sets: [structure_size_free, size_dependent]
    residualise: structure_size_free
  - name: temporal_only
    sets: [temporal]
  - name: volume_plus_temporal
    sets: [volume_baseline, temporal]
  # H1: does fusing all three channels beat the best single-signal baseline?
  - name: full_fusion
    sets: [volume_baseline, structure_size_free, sentiment, temporal]
  # Same features, heavily regularised. 31 features against ~42 positive cases
  # is close to one parameter per positive; the gap between these two arms is
  # evidence about overfitting, not about fusion.
  - name: full_fusion_regularised
    sets: [volume_baseline, structure_size_free, sentiment, temporal]
    model: regularised
  - name: volume_extended
    sets: [volume_baseline, size_dependent, temporal_size_dependent]

# Systematic size-proxy audit. Every channel so far shipped at least one
# feature that was really a sample-size count under another name, and none was
# detectable from model performance because all of them raised accuracy.
# Each channel therefore correlates every feature against window volume
# (Spearman, so monotone-but-nonlinear proxies do not slip through) and anything
# at or above this threshold is reassigned to volume.
audit:
  size_proxy_spearman_threshold: 0.4
  # One declared proxy for volume, used for every audit and every
  # residualisation. Never chosen per feature.
  volume_proxy: window_tweets

# ARIMA order for the temporal channel's residual features.
#
# (0,1,2), SELECTED — not assumed. The order was previously (1,1,1) by
# convention, hardcoded in temporal.py. src/eval/arima_order.py fits a 16-order
# grid to all 129 pre-cutoff histories and scores AIC and BIC over the units
# where every order converged (all 129 did). Evidence in
# outputs/tables/arima_order_selection.json:
#
#   d = 1: differencing moves ADF rejection of a unit root from 51.9% to 84.5%
#          of series, and KPSS rejection of stationarity from 54.3% to 10.9%.
#          Both tests agree after differencing.
#   (p,q): (0,1,2) is best on mean AIC (192.13) and mean BIC (197.33), and wins
#          on 34/129 units by AIC and 52/129 by BIC. The old (1,1,1) sits at
#          195.76 / 201.04 and wins on ZERO units under either criterion. The
#          data prefers no AR term at all.
#
# Selection reads no labels, so it cannot leak outcome information into the
# features. Changing this order changes which coefficients exist as features,
# so the feature lists below must be kept consistent with it.
arima:
  order: [0, 1, 2]

evaluation:
  decision_threshold: 0.5         # for F1 / precision / recall / McNemar
  # Paired comparisons. McNemar on out-of-fold binary predictions.
  mcnemar_pairs:
    - [volume_only, structure_size_free]
    - [volume_only, sentiment_only]
    - [volume_only, temporal_only]
    - [volume_only, volume_plus_structure]
    - [volume_only, volume_plus_sentiment]
    - [volume_only, volume_plus_temporal]
    - [volume_only, full_fusion]
    - [structure_size_free, structure_residualised]
    - [full_fusion, full_fusion_regularised]
    - [volume_only, volume_extended]
    # THE H1 TEST. H1 claims fusion beats the best SINGLE-SIGNAL baseline, and
    # the best single-signal baseline is not volume_only (3 features) — it is
    # volume_extended, which is still volume alone but given every size-derived
    # feature the audit exiled. Comparing fusion only against the 3-feature
    # baseline would be choosing a weak opponent.
    - [full_fusion, volume_extended]
    - [volume_plus_structure, volume_extended]

sentiment:
  model: cardiffnlp/twitter-xlm-roberta-base-sentiment
  # PINNED. HuggingFace `main` can move under us and silently change every
  # sentiment number in the report. This is the commit the results were
  # produced with.
  revision: f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8
  labels: [negative, neutral, positive]

  # Measured on 400 real Spanish tweets from this corpus, not assumed:
  #   batch 16 length-sorted  35.2 tweets/s   <- chosen
  #   batch 16 unsorted       26.1
  #   batch 32 length-sorted  29.3            <- larger batch is SLOWER
  # int8 dynamic quantization was rejected: only 12% faster and agreed with
  # fp32 on 41.4% of labels, barely above chance for three classes.
  batch_size: 16
  max_length: 128                 # only 0.3% of tweets exceed this
  sort_by_length: true
  dtype: float32                  # do NOT quantize; see above

  # Cache holds the raw 3-class probabilities keyed by text hash, so
  # aggregates can be redefined without re-running the model. Scored over the
  # union of all lead-sweep windows, not just the primary one.
  cache_file: sentiment_scores.parquet
  cache_over_lead_sweep: true

  strong_threshold: 0.6           # |polarity| above this counts as strongly affective

  vader:
    enabled: true
    # English-subset baseline only. Route 2 filters features to Spanish, so
    # VADER scores a different tweet population; coverage is reported and it is
    # a descriptive check, never an ablation arm.
    language: en

network:
  # Betweenness is O(V*E) exact. Sample k pivots instead when the graph is
  # larger than this; null forces exact everywhere.
  betweenness_k: 100
  growth_slices: 3                # sub-intervals for graph growth rate
  louvain_resolution: 1.0

model:
  n_jobs: 1                       # determinism, not hardware — see CLAUDE.md
  cv_folds: 5
  # NO cv_repeats. A `cv_repeats: 8` key used to sit here, inherited from the
  # prototype (which genuinely uses RepeatedStratifiedKFold with 8 repeats).
  # Nothing in this pipeline ever read it: every evaluator runs
  # StratifiedGroupKFold(n_splits=5) exactly once. It was removed because a
  # config key that looks authoritative and is never read is how a false
  # methodology claim gets written down — "5-fold CV repeated 8 times" had
  # already reached the README from this line.
  n_permutations: 100
  n_bootstrap: 1000
